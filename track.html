<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track your order — Tangy's</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EE; --panel:#FFFFFF; --line:rgba(32,16,8,0.09);
    --ink:#211208; --muted:#8A7A6C; --muted-soft:#B8AA9C;
    --brand:#E23B23; --brand-dark:#B92D19; --brand-soft:#FDE7E2;
    --gold:#C9852B; --gold-soft:#FBF0DE;
    --good:#1E7A46; --good-soft:#E7F5EC; --bad:#C13324;
    --shadow-sm:0 1px 2px rgba(32,16,8,0.05);
    --shadow-md:0 10px 30px rgba(32,16,8,0.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:0.001ms !important;transition-duration:0.001ms !important;} }

  header{padding:18px 20px;display:flex;justify-content:center;}
  .logo-badge{background:var(--brand);border-radius:10px;padding:8px 15px;display:inline-flex;align-items:center;box-shadow:0 3px 0 var(--brand-dark);}
  .logo-badge span{font-family:'Permanent Marker',cursive;color:#fff;font-size:1.1rem;line-height:1;}
  main{max-width:460px;margin:0 auto;padding:8px 18px 60px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-md);overflow:hidden;margin-bottom:16px;}
  .card-pad{padding:22px 22px;}
  .order-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .order-head .num{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.05rem;}
  .order-head .type{font-size:0.76rem;color:var(--muted);background:var(--bg);padding:4px 10px;border-radius:999px;font-weight:600;}
  .eta{color:var(--muted);font-size:0.84rem;}

  .stepper{padding:26px 22px 8px;}
  .step{display:flex;gap:14px;position:relative;padding-bottom:30px;}
  .step:last-child{padding-bottom:0;}
  .step-rail{display:flex;flex-direction:column;align-items:center;}
  .step-dot{width:34px;height:34px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted-soft);transition:background .3s ease, border-color .3s ease, color .3s ease;z-index:1;}
  .step-dot svg{width:16px;height:16px;}
  .step-line{width:2px;flex:1;background:var(--line);margin-top:2px;transition:background .3s ease;}
  .step.done .step-dot{background:var(--good);border-color:var(--good);color:#fff;}
  .step.done .step-line{background:var(--good);}
  .step.current .step-dot{background:var(--brand);border-color:var(--brand);color:#fff;animation:stepPulse 1.6s ease infinite;}
  @keyframes stepPulse{0%,100%{box-shadow:0 0 0 0 rgba(226,59,35,0.35);}50%{box-shadow:0 0 0 6px rgba(226,59,35,0);}}
  .step-body{padding-top:5px;}
  .step-label{font-weight:700;font-size:0.92rem;color:var(--muted-soft);transition:color .3s ease;}
  .step.done .step-label,.step.current .step-label{color:var(--ink);}
  .step-time{font-size:0.74rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:3px;min-height:1em;}
  .step-note{font-size:0.78rem;color:var(--muted);margin-top:4px;max-width:260px;}
  .step.cancelled .step-dot{background:var(--bad);border-color:var(--bad);color:#fff;}

  .divider{border-top:1px solid var(--line);}
  .items-list{padding:18px 22px;}
  .items-list .row{display:flex;justify-content:space-between;font-size:0.86rem;padding:6px 0;}
  .items-list .row .qty{color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-right:8px;}
  .items-total{display:flex;justify-content:space-between;padding:14px 22px;background:var(--bg);font-weight:800;font-size:0.98rem;}
  .items-total .val{font-family:'IBM Plex Mono',monospace;}
  .info-row{display:flex;gap:10px;padding:12px 22px;font-size:0.82rem;color:var(--muted);}
  .info-row svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--gold);}
  .info-row b{color:var(--ink);}
  .help-note{text-align:center;font-size:0.78rem;color:var(--muted);margin-top:6px;}
  .help-note a{color:var(--brand);font-weight:600;text-decoration:none;}
  .center-msg{text-align:center;padding:60px 20px;color:var(--muted);font-size:0.9rem;}
  .rider-row{display:flex;align-items:center;gap:14px;padding:16px 20px;}
  .rider-avatar{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
  .rider-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;margin-bottom:2px;}
  .rider-name{font-size:0.96rem;font-weight:700;}
  .rider-call-btn{width:42px;height:42px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rider-call-btn svg{width:19px;height:19px;}
</style>
</head>
<body>

<header><div class="logo-badge"><span>Tangy&#8217;s</span></div></header>

<main>
  <div id="loadingMsg" class="center-msg">Loading your order&hellip;</div>
  <div id="content" style="display:none;">
    <div class="card card-pad">
      <div class="order-head">
        <span class="num mono" id="orderNum"></span>
        <span class="type" id="orderType"></span>
      </div>
      <div class="eta" id="etaLine"></div>
    </div>
    <div class="card"><div class="stepper" id="stepper"></div></div>
    <div class="card">
      <div class="items-list" id="itemsList"></div>
      <div id="deliveryFeeRow" style="display:none;justify-content:space-between;padding:0 22px 12px;"><span style="color:var(--muted);font-size:0.86rem;">Delivery fee</span><span class="mono" id="deliveryFeeVal" style="font-size:0.86rem;"></span></div>
      <div class="divider"></div>
      <div class="items-total"><span>Total</span><span class="val" id="orderTotal">Rs. 0</span></div>
    </div>
    <div class="card" id="riderCard" style="display:none;">
      <div class="rider-row">
        <div class="rider-avatar">&#127955;</div>
        <div style="flex:1;">
          <div class="rider-label">Your rider</div>
          <div class="rider-name" id="riderNameText"></div>
        </div>
        <a href="#" id="riderCallLink" class="rider-call-btn" title="Call rider">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        </a>
      </div>
    </div>
    <div class="card" id="infoCard">
      <div class="info-row" id="addressRow" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <div id="addressText"></div>
      </div>
      <div class="info-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>
        <div>Paying by <b id="payMethodRow"></b> &mdash; <span id="payConfirmedNote">confirmed on arrival</span></div>
      </div>
    </div>
    <p class="help-note">Need help with this order? <a href="https://wa.me/923181450075" target="_blank">Message us on WhatsApp</a></p>
  </div>
</main>

<script>
// ====== Same Supabase project as the website ======
const SUPABASE_URL = 'https://sfsggkofnadleawlelih.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmc2dna29mbmFkbGVhd2xlbGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzUxNTgsImV4cCI6MjEwMzMxMTE1OH0.3Bhdhp1QMbB9iJIben36y9DNxyaxgAlSssongOQJ7Qs';
// ====================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function money(n){ return 'Rs. ' + Math.round(Number(n)||0).toLocaleString(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const params = new URLSearchParams(window.location.search);
const orderId = params.get('id');

const ICONS = {
  check: '<path d="M5 12l4 4L19 6"/>',
  flame: '<path d="M12 2c2 4-2 5-2 9a4 4 0 108 0c0-2-1-3-1-3s2 1 2 5a7 7 0 11-14 0c0-5 4-6 4-11 0 0 2 1 3 0z"/>',
  bike: '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-9h4l4 9M10 8h5"/>',
  bag: '<path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
  home: '<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>'
};

function stepsFor(type){
  const base = [
    { key:'pending', label:'Order placed', icon:'check', note:'We\'ve got it — sending it to the kitchen.' },
    { key:'preparing', label:'Preparing your food', icon:'flame', note:'Freshly made, right after you ordered.' },
  ];
  if(type === 'delivery'){
    base.push({ key:'out_for_delivery', label:'Out for delivery', icon:'bike', note:'On its way to you now.' });
  }else{
    base.push({ key:'ready', label:'Ready for pickup', icon:'bag', note:'Come grab it whenever you\'re ready.' });
  }
  base.push({ key:'completed', label: type==='delivery' ? 'Delivered' : 'Completed', icon:'home', note:'Enjoy!' });
  return base;
}

let lastRenderedStatus = null;
let stepTimes = {};

async function fetchOrder(){
  if(!orderId){
    document.getElementById('loadingMsg').textContent = "We couldn't find that order — check the link and try again.";
    return;
  }
  const [{ data: statusRows, error: e1 }, { data: itemRows, error: e2 }] = await Promise.all([
    sb.rpc('get_order_status', { p_order_id: orderId }),
    sb.rpc('get_order_items_public', { p_order_id: orderId }),
  ]);
  if(e1 || !statusRows || !statusRows.length){
    document.getElementById('loadingMsg').textContent = "We couldn't find that order — check the link and try again.";
    return;
  }
  const order = statusRows[0];
  const items = itemRows || [];
  render(order, items);
}

function render(order, items){
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  document.getElementById('orderNum').textContent = '#' + order.order_number;
  document.getElementById('orderType').textContent = order.order_type.replace('_',' ');
  document.getElementById('orderTotal').textContent = money(order.total);
  document.getElementById('payMethodRow').textContent = order.payment_method;
  document.getElementById('payConfirmedNote').textContent = order.payment_confirmed ? 'confirmed' : 'confirmed on arrival';

  if(order.delivery_fee > 0){
    document.getElementById('deliveryFeeRow').style.display = 'flex';
    document.getElementById('deliveryFeeVal').textContent = money(order.delivery_fee);
  }

  if(order.rider_name && order.order_type === 'delivery'){
    document.getElementById('riderCard').style.display = 'block';
    document.getElementById('riderNameText').textContent = order.rider_name;
    document.getElementById('riderCallLink').href = order.rider_phone ? 'tel:' + order.rider_phone.replace(/[^\d+]/g,'') : '#';
  }

  document.getElementById('itemsList').innerHTML = items.map(i =>
    `<div class="row"><span><span class="qty">${i.quantity}x</span>${esc(i.item_name)}</span><span class="mono">${money(i.line_total)}</span></div>`
  ).join('');

  if(order.order_type === 'delivery' && order.delivery_address){
    document.getElementById('addressRow').style.display = 'flex';
    document.getElementById('addressText').textContent = order.delivery_address;
  }

  if(order.status === 'cancelled'){
    document.getElementById('stepper').innerHTML = `
      <div class="step cancelled">
        <div class="step-rail"><div class="step-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">${ICONS.x}</svg></div></div>
        <div class="step-body"><div class="step-label">Order cancelled</div><div class="step-note">Get in touch if this wasn't expected.</div></div>
      </div>`;
    document.getElementById('etaLine').textContent = '';
    return;
  }

  const steps = stepsFor(order.order_type);
  const currentIndex = Math.max(0, steps.findIndex(s => s.key === order.status));
  if(order.status !== lastRenderedStatus){
    stepTimes[order.status] = new Date(order.updated_at || order.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    lastRenderedStatus = order.status;
  }

  document.getElementById('stepper').innerHTML = steps.map((s, i) => {
    const state = i < currentIndex ? 'done' : (i === currentIndex ? 'current' : '');
    const dotContent = state === 'done'
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">${ICONS.check}</svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICONS[s.icon]}</svg>`;
    const time = (i === currentIndex && stepTimes[s.key]) ? stepTimes[s.key] : '';
    return `
      <div class="step ${state}">
        <div class="step-rail">
          <div class="step-dot">${dotContent}</div>
          ${i < steps.length-1 ? '<div class="step-line"></div>' : ''}
        </div>
        <div class="step-body">
          <div class="step-label">${s.label}</div>
          <div class="step-time">${time}</div>
          ${state==='current' ? `<div class="step-note">${s.note}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const etaLine = document.getElementById('etaLine');
  etaLine.innerHTML = order.status === 'completed'
    ? (order.order_type==='delivery' ? 'Delivered &#127881;' : 'Completed &#127881;')
    : 'We\'ll update this the moment your order moves to the next step.';
}

fetchOrder();
setInterval(() => {
  if(document.visibilityState === 'visible') fetchOrder();
}, 5000);
</script>
</body>
</html>
